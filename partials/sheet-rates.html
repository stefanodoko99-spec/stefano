    <!-- THE RATES: the menu, every service and its starting price (shared/menu.js, changed or switched off in the admin), a tab for each group -->
    <section class="sheet sheet--rates" id="rates" aria-labelledby="rates-h" data-optional="rates" hidden>
      <h2 class="sheethead" id="rates-h" data-fit="head" data-ink="rates"><span data-i18n="ratesHead">The rates.</span></h2>
      <p class="sheet__lede" data-i18n="ratesLine">Every service and the price it starts from, in one menu.</p>
      <div class="ratecard">
        <p class="ratecard__strip"><span class="ratecard__kind" data-i18n="ratesKind">The menu</span><span>Stefano Doko, <span data-i18n="zone">Albania</span></span></p>
        <!-- the calculator (switched on in the admin) is the card itself: its lines are ticked in any tab, and add up at its foot -->
        <p class="calc__how" data-calc-how data-i18n="calcHow" hidden>Tick what the business needs, in any group: the sum is at the foot of the menu.</p>
        <div class="ratecard__tabs" data-rates-tabs hidden></div>
        <div class="ratecard__lists" data-rates-list></div>
        <p class="ratecard__note" data-rates-note hidden></p>
        <div class="calc" data-calc hidden>
          <p class="calc__total"><span data-i18n="calcTotal">Estimate</span> <output class="calc__sum" aria-live="polite" data-calc-total></output></p>
          <p class="calc__note" data-i18n="calcNote">An estimate from the rate card, not an offer: Stefano answers with the real price.</p>
          <a class="btn btn--ink" href="/contact/" data-calc-send hidden><span data-i18n="calcSend">Send it with a telegram</span><svg class="hand" aria-hidden="true"><use href="#hand"/></svg></a>
        </div>
      </div>
    </section>
